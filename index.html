<label for="vorname">Vorname</label>
<input type="text" id="vorname" name="vorname" required>

<label for="name">Name</label>
<input type="text" id="name" name="name" required>

<label for="email">E-Mail-Adresse</label>
<input type="email" id="email" name="email" required>

<label>Instrument vorhanden?</label>

    <label class="radio-option">

            name="instrument_vorhanden"
            value="eigenes_oder_organisierbar"
            required>

    </label>

    <label class="radio-option">

            type="radio"
            name="instrument_vorhanden"

```

</form>

<script>
const formular = document.getElementById("anmeldeformular");
const status = document.getElementById("formular-status");

formular.addEventListener("submit", function(event) {
    event.preventDefault();

    const daten = {
        vorname: document.getElementById("vorname").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        instrument: document.getElementById("instrument").value,
        instrument_vorhanden: document.querySelector(
            'input[name="instrument_vorhanden"]:checked'
        ).value
    };

    fetch("https://script.google.com/macros/s/AKfycbx2MJY6T7DIbPHVY9Bhxv60WY7g0ItumU0Swp0guyszWPCZG2GQIMi5yX5fdosnY4KXqQ/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(daten)
    });

    status.textContent = "Danke für deine Anmeldung!";
    formular.reset();
});
</script>
